name: CI

# 每次推送（分支或标签）和 PR 都跑一遍，用来确认代码本身是好的。
#
# 和 release.yml 一样，不使用任何外部 action（只用 runner 预装的 git / node / npm），
# 因为本仓库的 Actions 策略只允许 71-MengYi 自己仓库里的 action。
#
# 它同时也是发布流程的"对照组"：如果推标签时 Release 起不来而 CI 正常，
# 说明问题在某个工作流文件；如果两个都是 startup_failure，
# 说明问题在仓库的 Actions 设置（Settings → Actions → General）。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # 连代码都不取，只验证 runner 能跑起来。
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Runner 可用性
        run: |
          uname -a
          git --version
          node --version
          npm --version
          gh --version | head -n 1

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（手动 git，不依赖 actions/checkout）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "+${GITHUB_REF}:refs/remotes/ci"
          # ^{commit} 显式 peel：分支、标签、PR 合并引用都能稳定落到提交上。
          git checkout -q --detach "refs/remotes/ci^{commit}"
          git log --oneline -1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          set -euo pipefail
          for file in main.js manifest.json styles.css; do
            test -s "$file" || { echo "::error::$file 缺失或为空"; exit 1; }
            printf '%-14s %9s bytes\n' "$file" "$(stat -c%s "$file")"
          done
